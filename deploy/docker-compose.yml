# Lives on the server at /opt/lockgo/ (see docs/DEPLOYMENT.md), alongside a
# real .env (copy .env.example → .env and fill in real secrets — never
# committed). `docker compose pull && docker compose up -d` is exactly what
# the GitHub Actions deploy job runs over SSH.

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-YOUR_GITHUB_USERNAME}/lockgo-api:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"

  ui:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-YOUR_GITHUB_USERNAME}/lockgo-ui:latest
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
