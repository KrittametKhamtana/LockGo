# Base stack — no domain required. Lives on the server at /opt/lockgo/
# (see docs/DEPLOYMENT.md), alongside a real .env (copy .env.example → .env
# and fill in real secrets — never committed).
#
# `docker compose pull && docker compose up -d` is exactly what the GitHub
# Actions deploy job runs over SSH — as-is, this exposes the UI and API
# directly on host ports, reachable at http://<server-ip>:8080 and
# http://<server-ip>:8081 with no TLS. That's a deliberate default so the
# app is reachable from day one without needing DNS set up first.
#
# Once a real domain is ready, switch to running docker-compose.domain.yml
# instead (see docs/DEPLOYMENT.md's "Upgrading to domain mode") to add a
# Caddy reverse proxy with automatic TLS — this file doesn't change either
# way, you just pick which one you run.

services:
  api:
    image: ghcr.io/krittametkhamtana/lockgo-api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8080"

  ui:
    image: ghcr.io/krittametkhamtana/lockgo-ui:latest
    restart: unless-stopped
    ports:
      - "8080:80"
