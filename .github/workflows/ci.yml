name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: LockGo.Api

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: LockGo.Api

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
        working-directory: LockGo.Api

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5117/api

  build-and-push:
    name: Build & push images (GHCR)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: LockGo.Api
          file: LockGo.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lockgo-api:latest
            ghcr.io/${{ github.repository_owner }}/lockgo-api:${{ github.sha }}

      - name: Build & push UI image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          # Repo variable, not hardcoded — starts as http://<server-ip>:8081/api
          # (direct-IP mode, no domain yet) and changes to
          # https://<api-domain>/api later with zero workflow edits. Set at
          # Settings → Secrets and variables → Actions → Variables.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lockgo-ui:latest
            ghcr.io/${{ github.repository_owner }}/lockgo-ui:${{ github.sha }}

  deploy:
    name: Deploy to server
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/lockgo
            docker compose pull
            docker compose up -d
            docker image prune -f
